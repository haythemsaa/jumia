version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: ichri_nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/frontend
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ichri_network

  # PHP-FPM Application
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: ichri_app
    volumes:
      - ./backend:/var/www/backend
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=ichri_tunisia
      - DB_USERNAME=ichri_user
      - DB_PASSWORD=ichri_password
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - ichri_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ichri_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ichri_tunisia
      MYSQL_USER: ichri_user
      MYSQL_PASSWORD: ichri_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ichri_network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: ichri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ichri_network

  # PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ichri_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ichri_user
      PMA_PASSWORD: ichri_password
    depends_on:
      - mysql
    networks:
      - ichri_network

  # Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: ichri_queue
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - app
      - redis
    networks:
      - ichri_network

volumes:
  mysql_data:
  redis_data:

networks:
  ichri_network:
    driver: bridge
