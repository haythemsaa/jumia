<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - ICHRI Tunisia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="header" class="header fixed-top">
        <div class="top-bar bg-primary text-white py-2">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6"><small><i class="bi bi-telephone"></i> +216 XX XXX XXX</small></div>
                </div>
            </div>
        </div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../index.html"><span class="brand-gradient">ICHRI</span></a>
            </div>
        </nav>
    </header>

    <section class="py-5" style="margin-top: 120px;">
        <div class="container">
            <h2 class="mb-4">Mes Commandes</h2>
            <div id="ordersContainer"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const orders = await API.getOrders();
                if (orders && orders.data && orders.data.length > 0) {
                    container.innerHTML = orders.data.map(order => `
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h5>Commande #${order.order_number}</h5>
                                        <p class="text-muted mb-0">${HELPERS.formatDate(order.created_at)}</p>
                                    </div>
                                    <div class="text-end">
                                        <h5 class="text-primary mb-2">${HELPERS.formatPrice(order.total)}</h5>
                                        <span class="badge bg-info">${order.status}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center py-5"><i class="bi bi-inbox display-1 text-muted"></i><h3 class="mt-3">Aucune commande</h3></div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="text-center text-danger">Erreur de chargement</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
