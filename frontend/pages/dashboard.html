<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - ICHRI Tunisia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="header" class="header fixed-top">
        <div class="top-bar bg-primary text-white py-2">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6"><small><i class="bi bi-telephone"></i> +216 XX XXX XXX</small></div>
                    <div class="col-md-6 text-end">
                        <select id="langSwitcher" class="form-select form-select-sm bg-transparent text-white border-white" style="width: auto;">
                            <option value="fr">Français</option>
                            <option value="ar">العربية</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../index.html"><span class="brand-gradient">ICHRI</span></a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="bi bi-heart fs-4"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart3 fs-4"></i></a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><i class="bi bi-person-circle fs-4"></i></a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="dashboard.html">Tableau de bord</a></li>
                            <li><a class="dropdown-item" href="profile.html">Mon profil</a></li>
                            <li><a class="dropdown-item" href="orders.html">Mes commandes</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Déconnexion</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="dashboard-section py-5" style="margin-top: 120px;">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="text-center mb-3">
                                <div class="avatar-circle mb-2">
                                    <i class="bi bi-person-circle fs-1"></i>
                                </div>
                                <h6 id="userName">Chargement...</h6>
                                <p class="text-muted small" id="userEmail"></p>
                            </div>
                            <nav class="nav flex-column">
                                <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Tableau de bord</a>
                                <a class="nav-link" href="orders.html"><i class="bi bi-box-seam me-2"></i> Mes commandes</a>
                                <a class="nav-link" href="wishlist.html"><i class="bi bi-heart me-2"></i> Mes favoris</a>
                                <a class="nav-link" href="profile.html"><i class="bi bi-person me-2"></i> Mon profil</a>
                                <a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> Déconnexion</a>
                            </nav>
                        </div>
                    </div>
                </div>

                <div class="col-lg-9">
                    <h3 class="mb-4">Tableau de bord</h3>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="text-muted mb-2">Commandes</h6>
                                            <h2 id="totalOrders">0</h2>
                                        </div>
                                        <i class="bi bi-box-seam fs-1 text-primary"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="text-muted mb-2">Points fidélité</h6>
                                            <h2 id="loyaltyPoints">0</h2>
                                        </div>
                                        <i class="bi bi-award fs-1 text-warning"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="text-muted mb-2">Favoris</h6>
                                            <h2 id="wishlistCount">0</h2>
                                        </div>
                                        <i class="bi bi-heart fs-1 text-danger"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Commandes récentes</h5>
                        </div>
                        <div class="card-body" id="recentOrders"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
