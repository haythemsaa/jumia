<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Favoris - ICHRI Tunisia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="header" class="header fixed-top">
        <div class="top-bar bg-primary text-white py-2">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6"><small><i class="bi bi-telephone"></i> +216 XX XXX XXX</small></div>
                    <div class="col-md-6 text-end">
                        <select id="langSwitcher" class="form-select form-select-sm bg-transparent text-white border-white" style="width: auto;">
                            <option value="fr">Français</option>
                            <option value="ar">العربية</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../index.html"><span class="brand-gradient">ICHRI</span></a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart3 fs-4"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-person-circle fs-4"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="py-5" style="margin-top: 120px;">
        <div class="container">
            <h2 class="mb-4">Mes Favoris</h2>
            <div class="row g-4" id="wishlistContainer"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        async function loadWishlist() {
            const container = document.getElementById('wishlistContainer');
            try {
                const wishlist = await API.getWishlist();
                if (wishlist && wishlist.length > 0) {
                    container.innerHTML = wishlist.map(item => createProductCard(item.product)).join('');
                } else {
                    container.innerHTML = '<div class="col-12 text-center py-5"><i class="bi bi-heart display-1 text-muted"></i><h3 class="mt-3">Aucun favori</h3></div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="col-12 text-center text-danger">Erreur de chargement</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
</body>
</html>
